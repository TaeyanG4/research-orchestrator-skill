<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Setup questions and project settings</title>
  <desc id="desc">Before the first session the agent asks six questions: user name, platforms, git sync, plan collector, reviewer, and cross-check fallback. The answers become the Project settings at the top of agents.md, which the user can edit later. The plan collector starts collecting when the queue falls to 5 items and stops at 50.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#11284C"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5FB4F5"/>
    </marker>
  </defs>

  <rect width="1200" height="580" rx="20" fill="url(#bg)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="48" y="58" fill="#FFFFFF" font-size="27" font-weight="700">Six answers shape the project</text>
    <text x="48" y="90" fill="#A9C1E3" font-size="16">Asked once before the first session, stored in agents.md, and editable by the user at any time.</text>

    <!-- Six questions -->
    <g>
      <rect x="48" y="122" width="250" height="78" rx="12" fill="#132F57" stroke="#2A5384"/>
      <text x="68" y="150" fill="#8FA9CC" font-size="13">1 · Your name</text>
      <text x="68" y="180" fill="#FFFFFF" font-size="18" font-weight="700">kim</text>

      <rect x="312" y="122" width="250" height="78" rx="12" fill="#132F57" stroke="#2A5384"/>
      <text x="332" y="150" fill="#8FA9CC" font-size="13">2 · Platforms</text>
      <text x="332" y="180" fill="#FFFFFF" font-size="18" font-weight="700">multi <tspan fill="#A9C1E3" font-size="14" font-weight="400">Claude Code, Codex</tspan></text>

      <rect x="48" y="214" width="250" height="78" rx="12" fill="#132F57" stroke="#2A5384"/>
      <text x="68" y="242" fill="#8FA9CC" font-size="13">3 · Git sync</text>
      <text x="68" y="272" fill="#FFFFFF" font-size="18" font-weight="700">push <tspan fill="#A9C1E3" font-size="14" font-weight="400">commit · off</tspan></text>

      <rect x="312" y="214" width="250" height="78" rx="12" fill="#132F57" stroke="#2A5384"/>
      <text x="332" y="242" fill="#8FA9CC" font-size="13">4 · Plan collector</text>
      <text x="332" y="272" fill="#FFFFFF" font-size="18" font-weight="700">Claude Code / sonnet</text>

      <rect x="48" y="306" width="250" height="78" rx="12" fill="#132F57" stroke="#2A5384"/>
      <text x="68" y="334" fill="#8FA9CC" font-size="13">5 · Reviewer</text>
      <text x="68" y="364" fill="#FFFFFF" font-size="18" font-weight="700">Codex / sol</text>

      <rect x="312" y="306" width="250" height="78" rx="12" fill="#132F57" stroke="#2A5384"/>
      <text x="332" y="334" fill="#8FA9CC" font-size="13">6 · Cross-check fallback</text>
      <text x="332" y="364" fill="#FFFFFF" font-size="18" font-weight="700">wait <tspan fill="#A9C1E3" font-size="14" font-weight="400">or same-host</tspan></text>
    </g>

    <path d="M570 253 H 600" fill="none" stroke="#5FB4F5" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- agents.md settings -->
    <rect x="610" y="122" width="542" height="262" rx="14" fill="#0F2546" stroke="#2A5384"/>
    <text x="634" y="152" fill="#EAF2FF" font-size="18" font-weight="700" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">agents.md</text>
    <g font-size="14" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">
      <text x="634" y="182" fill="#8FA9CC">## Project settings</text>
      <text x="634" y="206" fill="#CFE0F5">- Platform mode: <tspan fill="#5FB4F5">multi</tspan></text>
      <text x="634" y="228" fill="#CFE0F5">- Platforms: <tspan fill="#5FB4F5">Claude Code, Codex</tspan></text>
      <text x="634" y="250" fill="#CFE0F5">- Git sync: <tspan fill="#5FB4F5">push</tspan></text>
      <text x="634" y="272" fill="#CFE0F5">- Plan collector: <tspan fill="#2BB673">on — Claude Code / sonnet</tspan></text>
      <text x="634" y="294" fill="#CFE0F5">- Plan queue limits: <tspan fill="#2BB673">stop at 50, resume at 5</tspan></text>
      <text x="634" y="316" fill="#CFE0F5">- Reviewer: <tspan fill="#2BB673">on — Codex / sol</tspan></text>
      <text x="634" y="338" fill="#CFE0F5">- Cross-check fallback: <tspan fill="#2BB673">wait</tspan></text>
    </g>
    <text x="634" y="368" fill="#8FA9CC" font-size="13"><tspan fill="#5FB4F5">blue</tspan>: edit, then --reconfigure regenerates the rules · <tspan fill="#2BB673">green</tspan>: takes effect immediately</text>

    <!-- Collector queue limits -->
    <text x="48" y="432" fill="#D6E6FA" font-size="16" font-weight="700">Plan collector keeps the queue supplied</text>
    <text x="48" y="456" fill="#8FA9CC" font-size="14">Plan items across all sections (0 → 60)</text>
    <rect x="48" y="476" width="1104" height="26" rx="13" fill="#0F2546" stroke="#2A5384"/>
    <rect x="48" y="476" width="74" height="26" rx="13" fill="#E8875A"/>
    <rect x="122" y="476" width="846" height="26" fill="none" stroke="#2BB673" stroke-width="2" stroke-dasharray="8 6"/>
    <line x1="140" y1="466" x2="140" y2="512" stroke="#5FB4F5" stroke-width="3"/>
    <line x1="968" y1="466" x2="968" y2="512" stroke="#F2A93B" stroke-width="3"/>
    <text x="140" y="534" fill="#5FB4F5" font-size="14" font-weight="600" text-anchor="middle">resume at 5: a round starts</text>
    <text x="545" y="494" fill="#2BB673" font-size="14" font-weight="600" text-anchor="middle">collector adds diverse, de-duplicated items</text>
    <text x="968" y="534" fill="#F2A93B" font-size="14" font-weight="600" text-anchor="middle">stop at 50: the round ends</text>
    <text x="1152" y="560" fill="#8FA9CC" font-size="13" text-anchor="end">Between rounds nothing is collected; the queue drains back to 5.</text>
  </g>
</svg>
