<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">One research loop, shared by people and AI agents</title>
  <desc id="desc">People, AI agents on different platforms, and sub-agents feed one loop around four shared files: collect hypotheses, run experiments, verify each result once, learn from every result, and repeat. Any session can stop; the next one resumes from the files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#11284C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1687D9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1687D9" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5FB4F5"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="20" fill="url(#bg)"/>
  <circle cx="780" cy="262" r="230" fill="url(#glow)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="48" y="60" fill="#FFFFFF" font-size="28" font-weight="700">One loop, shared by people and AI agents</text>
    <text x="48" y="92" fill="#A9C1E3" font-size="16">Any session can stop; the next one resumes from the files.</text>

    <!-- Who feeds the loop -->
    <g>
      <!-- person -->
      <circle cx="92" cy="186" r="26" fill="#16365F" stroke="#9DB2FF" stroke-width="2"/>
      <circle cx="92" cy="180" r="7" fill="#9DB2FF"/>
      <path d="M78 200 Q 92 188 106 200" fill="#9DB2FF"/>
      <text x="134" y="192" fill="#FFFFFF" font-size="17" font-weight="700">People</text>

      <!-- agents on platforms -->
      <circle cx="92" cy="262" r="26" fill="#16365F" stroke="#E8875A" stroke-width="2"/>
      <rect x="82" y="252" width="20" height="20" rx="4" fill="none" stroke="#E8875A" stroke-width="2.5"/>
      <circle cx="88" cy="260" r="2" fill="#E8875A"/><circle cx="96" cy="260" r="2" fill="#E8875A"/>
      <path d="M87 267 H 97" stroke="#E8875A" stroke-width="2" stroke-linecap="round"/>
      <text x="134" y="258" fill="#FFFFFF" font-size="17" font-weight="700">AI agents</text>
      <text x="134" y="278" fill="#8FA9CC" font-size="13">Claude Code · Codex · any platform</text>

      <!-- sub-agents -->
      <circle cx="92" cy="338" r="26" fill="#16365F" stroke="#3FC1A0" stroke-width="2"/>
      <circle cx="84" cy="334" r="5" fill="none" stroke="#3FC1A0" stroke-width="2"/>
      <circle cx="100" cy="334" r="5" fill="none" stroke="#3FC1A0" stroke-width="2"/>
      <circle cx="92" cy="346" r="5" fill="none" stroke="#3FC1A0" stroke-width="2"/>
      <text x="134" y="334" fill="#FFFFFF" font-size="17" font-weight="700">Sub-agents</text>
      <text x="134" y="354" fill="#8FA9CC" font-size="13">collector · reviewer</text>

      <path d="M360 186 C 440 186, 440 262, 492 262" fill="none" stroke="#3B5578" stroke-width="2"/>
      <path d="M360 262 H 492" fill="none" stroke="#3B5578" stroke-width="2"/>
      <path d="M360 338 C 440 338, 440 262, 492 262" fill="none" stroke="#3B5578" stroke-width="2"/>
    </g>

    <!-- Center: four files -->
    <circle cx="780" cy="262" r="96" fill="#0F2546" stroke="#2A5384" stroke-width="2"/>
    <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle">
      <text x="780" y="236" fill="#9DB2FF">agents.md</text>
      <text x="780" y="258" fill="#5FB4F5">plan.md</text>
      <text x="780" y="280" fill="#2BB673">discoveries.md</text>
      <text x="780" y="302" fill="#F2A93B">handoff.md</text>
    </g>

    <!-- Loop arrows (clockwise, r=176) -->
    <g fill="none" stroke="#5FB4F5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M 818 90 A 176 176 0 0 1 948 216"/>
      <path d="M 952 308 A 176 176 0 0 1 818 434"/>
      <path d="M 742 434 A 176 176 0 0 1 612 308"/>
      <path d="M 608 216 A 176 176 0 0 1 742 90"/>
    </g>

    <!-- Collect (top) -->
    <circle cx="780" cy="86" r="34" fill="#132F57" stroke="#5FB4F5" stroke-width="2"/>
    <text x="780" y="94" fill="#FFFFFF" font-size="22" text-anchor="middle">✦</text>
    <text x="780" y="38" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="middle">Collect</text>

    <!-- Run (right) -->
    <circle cx="956" cy="262" r="34" fill="#132F57" stroke="#5FB4F5" stroke-width="2"/>
    <text x="958" y="270" fill="#FFFFFF" font-size="20" text-anchor="middle">▶</text>
    <text x="1030" y="268" fill="#FFFFFF" font-size="17" font-weight="700">Run</text>
    <text x="1030" y="290" fill="#8FA9CC" font-size="13">on free compute</text>

    <!-- Learn (bottom) -->
    <circle cx="780" cy="438" r="34" fill="#132F57" stroke="#2BB673" stroke-width="2"/>
    <text x="780" y="446" fill="#FFFFFF" font-size="20" text-anchor="middle">◆</text>
    <text x="780" y="496" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="middle">Learn</text>

    <!-- Verify (left) -->
    <circle cx="604" cy="262" r="34" fill="#132F57" stroke="#5FB4F5" stroke-width="2"/>
    <text x="604" y="270" fill="#FFFFFF" font-size="20" text-anchor="middle">✓</text>
    <text x="530" y="252" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="end">Verify</text>
    <text x="530" y="274" fill="#8FA9CC" font-size="13" text-anchor="end">once, by another host</text>
  </g>
</svg>
