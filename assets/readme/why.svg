<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Why use it: a sustainable research loop shared by people and AI agents</title>
  <desc id="desc">People and AI agents on different platforms share four files. A loop runs continuously: a collector proposes hypotheses, agents run experiments on available compute, a different host or a reviewer verifies each result, every result becomes a discovery, and the loop plans what to test next. Settings in agents.md customize the loop; the consistency checker keeps it safe to resume at any time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#11284C"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5FB4F5"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3B5578"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="20" fill="url(#bg)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="48" y="58" fill="#FFFFFF" font-size="27" font-weight="700">One research loop, shared by people and AI agents</text>
    <text x="48" y="90" fill="#A9C1E3" font-size="16">Any session, on any platform, run by anyone, can stop and the next one resumes from the files — the loop keeps going.</text>

    <!-- Left: who takes part -->
    <text x="48" y="138" fill="#8FA9CC" font-size="13" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">who takes part</text>

    <rect x="48" y="150" width="232" height="64" rx="12" fill="#132F57" stroke="#2A5384"/>
    <text x="68" y="177" fill="#FFFFFF" font-size="16" font-weight="700">kim · Claude Code</text>
    <text x="68" y="199" fill="#8FA9CC" font-size="13">slot A · runs experiments</text>

    <rect x="48" y="226" width="232" height="64" rx="12" fill="#132F57" stroke="#2A5384"/>
    <text x="68" y="253" fill="#FFFFFF" font-size="16" font-weight="700">lee · Codex</text>
    <text x="68" y="275" fill="#8FA9CC" font-size="13">slot B · cross-checks A's results</text>

    <rect x="48" y="302" width="232" height="64" rx="12" fill="#132F57" stroke="#2A5384"/>
    <text x="68" y="329" fill="#FFFFFF" font-size="16" font-weight="700">park · reading the files</text>
    <text x="68" y="351" fill="#8FA9CC" font-size="13">edits settings, reviews discoveries</text>

    <rect x="48" y="378" width="232" height="64" rx="12" fill="#0F2546" stroke="#3B5578" stroke-dasharray="7 6"/>
    <text x="68" y="405" fill="#CFE0F5" font-size="16" font-weight="700">sub-agents</text>
    <text x="68" y="427" fill="#8FA9CC" font-size="13">collector · reviewer (any model)</text>

    <path d="M284 296 H 318" fill="none" stroke="#5FB4F5" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Center: the four files -->
    <rect x="326" y="150" width="212" height="292" rx="14" fill="#0F2546" stroke="#2A5384"/>
    <text x="432" y="182" fill="#EAF2FF" font-size="15" font-weight="700" text-anchor="middle">four shared files</text>
    <g font-size="15" font-weight="700" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">
      <rect x="346" y="198" width="172" height="46" rx="8" fill="#132F57" stroke="#7E97F5"/>
      <text x="432" y="227" fill="#EAF2FF" text-anchor="middle">agents.md</text>
      <rect x="346" y="254" width="172" height="46" rx="8" fill="#132F57" stroke="#1687D9"/>
      <text x="432" y="283" fill="#EAF2FF" text-anchor="middle">plan.md</text>
      <rect x="346" y="310" width="172" height="46" rx="8" fill="#132F57" stroke="#2BB673"/>
      <text x="432" y="339" fill="#EAF2FF" text-anchor="middle">discoveries.md</text>
      <rect x="346" y="366" width="172" height="46" rx="8" fill="#132F57" stroke="#F2A93B"/>
      <text x="432" y="395" fill="#EAF2FF" text-anchor="middle">handoff.md</text>
    </g>
    <text x="432" y="430" fill="#8FA9CC" font-size="12" text-anchor="middle">git sync keeps every machine current</text>

    <path d="M542 296 H 576" fill="none" stroke="#5FB4F5" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Right: the loop -->
    <text x="590" y="138" fill="#8FA9CC" font-size="13" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">the loop</text>

    <rect x="760" y="150" width="200" height="56" rx="12" fill="#132F57" stroke="#2A5384"/>
    <text x="860" y="174" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1 · Collect</text>
    <text x="860" y="194" fill="#8FA9CC" font-size="12" text-anchor="middle">scored, de-duplicated hypotheses</text>

    <rect x="952" y="266" width="200" height="56" rx="12" fill="#132F57" stroke="#2A5384"/>
    <text x="1052" y="290" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2 · Run</text>
    <text x="1052" y="310" fill="#8FA9CC" font-size="12" text-anchor="middle">on free CPU · GPU · remote</text>

    <rect x="760" y="382" width="200" height="56" rx="12" fill="#132F57" stroke="#2A5384"/>
    <text x="860" y="406" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3 · Verify</text>
    <text x="860" y="426" fill="#8FA9CC" font-size="12" text-anchor="middle">another host or a reviewer, once</text>

    <rect x="590" y="266" width="200" height="56" rx="12" fill="#132F57" stroke="#2BB673" stroke-width="2"/>
    <text x="690" y="290" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">4 · Learn</text>
    <text x="690" y="310" fill="#8FA9CC" font-size="12" text-anchor="middle">every result becomes a discovery</text>

    <path d="M960 178 Q 1052 178 1052 262" fill="none" stroke="#5FB4F5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1052 326 Q 1052 410 964 410" fill="none" stroke="#5FB4F5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M756 410 Q 690 410 690 326" fill="none" stroke="#5FB4F5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M690 262 Q 690 178 756 178" fill="none" stroke="#5FB4F5" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="860" y="354" fill="#5FB4F5" font-size="13" font-weight="600" text-anchor="middle">plan the next test: 0, 1, or many</text>

    <!-- Bottom: what makes it sustainable -->
    <g font-size="13">
      <rect x="48" y="470" width="262" height="110" rx="12" fill="#0F2546" stroke="#2A5384"/>
      <text x="68" y="496" fill="#D6E6FA" font-size="14" font-weight="700">Customize</text>
      <text x="68" y="518" fill="#8FA9CC">settings in agents.md: platforms,</text>
      <text x="68" y="536" fill="#8FA9CC">git sync, collector, reviewer,</text>
      <text x="68" y="554" fill="#8FA9CC">fallback — editable at any time</text>

      <rect x="326" y="470" width="262" height="110" rx="12" fill="#0F2546" stroke="#2A5384"/>
      <text x="346" y="496" fill="#D6E6FA" font-size="14" font-weight="700">Keep it honest</text>
      <text x="346" y="518" fill="#8FA9CC">check_project.py reports anything</text>
      <text x="346" y="536" fill="#8FA9CC">the four files disagree on, before</text>
      <text x="346" y="554" fill="#8FA9CC">a session starts new work</text>

      <rect x="604" y="470" width="262" height="110" rx="12" fill="#0F2546" stroke="#2A5384"/>
      <text x="624" y="496" fill="#D6E6FA" font-size="14" font-weight="700">Never idle, never reckless</text>
      <text x="624" y="518" fill="#8FA9CC">empty queue → cross-check, take</text>
      <text x="624" y="536" fill="#8FA9CC">over, collect; busy GPU → wait and</text>
      <text x="624" y="554" fill="#8FA9CC">do work that needs no compute</text>

      <rect x="882" y="470" width="270" height="110" rx="12" fill="#0F2546" stroke="#2A5384"/>
      <text x="902" y="496" fill="#D6E6FA" font-size="14" font-weight="700">Every fact has one home</text>
      <text x="902" y="518" fill="#8FA9CC">knowledge in discoveries, events in</text>
      <text x="902" y="536" fill="#8FA9CC">handoff, work in plan — nothing is</text>
      <text x="902" y="554" fill="#8FA9CC">repeated, nothing is lost</text>
    </g>
  </g>
</svg>
